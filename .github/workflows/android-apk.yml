name: android-apk
on:
  push: { branches: [main, plan1-recorder-dark-ui] }
  workflow_dispatch:
concurrency: { group: "apk-${{ github.ref }}", cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The signed release pair is published to a rolling GitHub Release below, which
    # needs write on contents. Artifact storage on this account is capped and shared
    # across repositories, so release assets carry the real weight instead.
    permissions: { contents: write }
    defaults: { run: { working-directory: track_scribe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', cache: true }
      - name: Restore the shared debug keystore
        # AGP generates a throwaway debug key per runner, so every CI debug APK used
        # to carry a different signature and the phone test loop had to uninstall -
        # wiping the recordings and the pmtiles packs - before installing the next one.
        # This keystore is the one on the development machine, so debug builds
        # reinstall over each other and keep their data.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 is not set - the debug APK will be signed with a throwaway key."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey | grep -i 'Fingerprint'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform=android-arm64
      # The debug APK is what the phone test loop installs, and the rolling release
      # asset below keeps the last one of these; the artifact copy is only a 48-hour
      # convenience, so it does not eat the shared storage quota.
      - uses: actions/upload-artifact@v4
        with:
          name: track-scribe-debug-apk
          path: track_scribe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Write the signing key and key.properties
        # track_scribe/android/app/build.gradle.kts reads track_scribe/android/key.properties
        # and falls back to the debug key when it is absent, so this step is the whole
        # difference between an uploadable release build and a debug-signed one.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Repository secret KEYSTORE_BASE64 is not set - add it before this step can sign a build." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build signed release APK and AAB
        run: |
          flutter build apk --release --target-platform=android-arm64
          flutter build appbundle

      - name: Prove the APK carries the release certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the signed pair on the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create release-latest \
            --prerelease \
            --title "Release builds" \
            --notes "Rolling signed release - every green CI run replaces these files." \
            || true
          gh release upload release-latest \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            --clobber
